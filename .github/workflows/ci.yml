name: Pull request checks

on:
  pull_request:
  push:
    branches:
      - codex/cloudflare-skill-reverse

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm copycheck
      - run: pnpm fontcheck
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
